<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="jssip.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- Grand Titre -->
        <h1>Client : ORGANISATION EN MONTAGES FINANCIERS --SAMIR</h1>

        <!-- Section Contacts -->
        <div class="contacts-header">
            <h2>Contacts</h2>
            <button class="btn-add" onclick="openAddModal()">+ Ajouter</button>
        </div>

        <!-- Liste des contacts -->
        <div id="contactsList" class="contacts-list">
            <div class="contact-card">
                <span class="contact-name">Samir</span>
                <span class="contact-phone" onclick="openCallModal('Samir', '0654643676')">📞 0654643676</span>
            </div>
        </div>
    </div>

    <!-- Modale 1 : Ajouter un Contact -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddModal()">&times;</span>
            <h3>Nouveau Contact</h3>
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" id="inputName">
            </div>
            <div class="form-group">
                <label>Numéro de téléphone</label>
                <input type="text" id="inputPhone">
            </div>
            <button class="btn-primary" onclick="saveContact()">Valider</button>
        </div>
    </div>

    <!-- Modale 2 : Fenêtre d'Appel -->
    <div id="callModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCallModal()">&times;</span>
            <h3>Appel WebRTC</h3>
            <div id="callTargetName" class="call-target-name"></div>
            <div id="callTargetNumber" class="call-target-number"></div>
            <div id="callStatus" class="call-status">Prêt</div>

            <div class="call-actions">
                <button class="btn-call" onclick="startCall()">Appeler</button>
                <button class="btn-hangup" onclick="terminateCall()">Raccrocher</button>
            </div>
        </div>
    </div>

    <!-- Élement Audio pour la lecture Média / Early Media -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script src="app.js"></script>
</body>
</html>
